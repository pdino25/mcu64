<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCU 64 Bracket</title>
<meta name="description" content="Pick winners through six rounds of a randomized 64-character Marvel bracket, hear each character's theme song, and crown a champion.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: sticky arena nav over a single scrolling column; each view is a section swapped by the hash. Dark-only by design: a stadium at night. */
:root {
  color-scheme: dark;
  --bg: #0d1220;
  --surface: #121a2b;
  --card: #172034;
  --raised: #1d2840;
  --line: #2a3654;
  --fg: #eef1f7;
  --muted: #95a0b8;
  --red: #e2363b;
  --red-ink: #ffffff;
  --gold: #f2c14e;
  --gold-ink: #241b05;
  --cyan: #5fd3e8;
  --font-display: "Oswald", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --radius: 8px;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 72px; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 80% 45% at 50% -10%, color-mix(in oklab, var(--red) 22%, transparent), transparent),
    radial-gradient(ellipse 60% 40% at 100% 100%, color-mix(in oklab, var(--cyan) 9%, transparent), transparent);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: .02em; text-transform: uppercase; margin: 0; text-wrap: balance; line-height: 1.1; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
img { max-width: 100%; display: block; }
a { color: var(--cyan); }

.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Nav */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: 20px; text-decoration: none; color: var(--fg); padding-block: 12px; flex-shrink: 0; }
.brand b { background: var(--red); color: var(--red-ink); padding: 0 6px; border-radius: 3px; font-weight: 600; }
.nav nav { display: flex; gap: 2px; overflow-x: auto; min-width: 0; scrollbar-width: none; }
.nav nav a { flex-shrink: 0; padding: 8px 12px; border-radius: 6px; text-decoration: none; color: var(--muted); font-family: var(--font-display); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
.nav nav a:hover { color: var(--fg); }
.nav nav a[aria-current="page"] { background: color-mix(in oklab, var(--red) 16%, transparent); color: var(--red); }

main { padding-block: 32px 64px; }
.eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .45em; text-transform: uppercase; color: var(--cyan); }
.page-head { text-align: center; display: grid; gap: 10px; justify-items: center; }
.page-head h1 { font-size: clamp(34px, 7vw, 60px); }
.page-head h1 em { font-style: normal; color: var(--red); }
.lede { color: var(--muted); max-width: 60ch; font-size: 14px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 6px; border: 1px solid transparent; font-size: 14px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; text-decoration: none; }
.btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.btn-primary { background: var(--red); color: var(--red-ink); }
.btn-primary:hover { background: color-mix(in oklab, var(--red) 85%, white); }
.btn-gold { background: var(--gold); color: var(--gold-ink); }
.btn-ghost { background: var(--raised); color: var(--fg); }
.btn-ghost:hover { background: var(--line); }
.btn-line { background: transparent; border-color: var(--line); color: var(--fg); }
.btn-line:hover { border-color: var(--cyan); color: var(--cyan); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn-icon { width: 38px; padding: 0; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 24px; }

/* Progress */
.progress { max-width: 440px; margin: 20px auto 0; }
.progress-meta { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 99px; background: var(--raised); overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; background: var(--red); border-radius: inherit; transition: width .3s; }
.bar.gold > i { background: var(--gold); }
.note { text-align: center; color: var(--cyan); font-size: 12px; margin-top: 8px; }
.setup { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 10px 12px; border: 1px solid color-mix(in oklab, var(--gold) 55%, transparent); border-radius: var(--radius); background: color-mix(in oklab, var(--gold) 8%, transparent); font-size: 13px; }
.setup > svg { width: 18px; height: 18px; color: var(--gold); flex-shrink: 0; }
.setup p { flex: 1; min-width: 0; }

/* Round tabs */
.rounds { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-top: 28px; }
@media (min-width: 760px) { .rounds { justify-content: center; } }
.round-tab { flex-shrink: 0; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 99px; padding: 6px 16px; font-family: var(--font-display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.round-tab.done { border-color: color-mix(in oklab, var(--gold) 50%, transparent); color: var(--gold); }
.round-tab.active { border-color: var(--red); color: var(--red); background: color-mix(in oklab, var(--red) 14%, transparent); box-shadow: 0 0 24px -6px color-mix(in oklab, var(--red) 60%, transparent); }
.round-tab:disabled { opacity: .35; cursor: not-allowed; }

/* Matchups */
.matches { display: grid; gap: 20px; margin-top: 20px; }
@media (min-width: 980px) { .matches { grid-template-columns: 1fr 1fr; } }
.match { border: 2px solid var(--red); background: color-mix(in oklab, var(--surface) 70%, transparent); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.match-label { text-align: center; font-family: var(--font-display); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.vs { text-align: center; font-family: var(--font-display); font-size: 12px; color: var(--red); letter-spacing: .3em; margin-block: -4px; }
.fighter { position: relative; display: flex; align-items: stretch; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); overflow: hidden; transition: border-color .15s, transform .15s, opacity .2s, filter .2s; }
.fighter:hover { border-color: color-mix(in oklab, var(--red) 70%, transparent); transform: translateY(-2px); }
.fighter.win { border-color: var(--gold); box-shadow: 0 0 0 1px color-mix(in oklab, var(--gold) 60%, transparent), 0 0 34px -8px color-mix(in oklab, var(--gold) 60%, transparent); }
.fighter.lose { opacity: .45; filter: grayscale(1); }
.fighter .portrait { width: 88px; height: 108px; flex-shrink: 0; border: 0; padding: 0; background: var(--raised); }
.fighter .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.fighter .pick { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 12px 52px 12px 14px; display: grid; align-content: center; gap: 2px; }
.fighter .name { font-family: var(--font-display); font-size: 18px; text-transform: uppercase; line-height: 1.15; }
.team { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.actor { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.advances { display: inline-flex; width: fit-content; margin-top: 6px; background: var(--gold); color: var(--gold-ink); font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; }
.fighter .info { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 6px; border: 1px solid color-mix(in oklab, var(--cyan) 60%, transparent); background: color-mix(in oklab, var(--surface) 80%, transparent); color: var(--cyan); display: grid; place-items: center; }
.fighter .info svg { width: 18px; height: 18px; }
.awaiting { display: grid; place-items: center; height: 108px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }

/* Bracket */
.bracket-hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 20px; }
.bracket { margin-top: 8px; max-height: 72vh; overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: color-mix(in oklab, var(--surface) 70%, transparent); padding: 16px; }
.bracket-grid { display: flex; width: max-content; }
.b-col { display: flex; flex-direction: column; }
.b-col h3 { width: 156px; text-align: center; font-size: 12px; letter-spacing: .2em; color: var(--red); padding: 4px 0; height: 28px; }
.b-slot { display: flex; align-items: center; }
.b-match { width: 156px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); overflow: hidden; font-size: 11px; }
.b-match button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-match button + button { border-top: 1px solid var(--line); }
.b-match button:not(:disabled):hover { background: var(--raised); color: var(--fg); }
.b-match button.won { background: color-mix(in oklab, var(--gold) 15%, transparent); color: var(--gold); font-weight: 600; }
.b-match button:disabled { cursor: default; }
.b-link { display: flex; flex-direction: column; padding-top: 28px; color: var(--line); }

/* Champion */
.champion { max-width: 680px; margin: 32px auto 0; border: 1px solid var(--gold); border-radius: 16px; overflow: hidden; background: var(--card); box-shadow: 0 0 60px -12px color-mix(in oklab, var(--gold) 55%, transparent); animation: rise .5s cubic-bezier(.2,.9,.3,1.2); }
@keyframes rise { from { transform: scale(.94); opacity: .4; } }
.champion-band { background: color-mix(in oklab, var(--gold) 15%, transparent); color: var(--gold); text-align: center; padding: 12px; font-family: var(--font-display); letter-spacing: .35em; text-transform: uppercase; font-size: 14px; }
.champion-art { background: var(--surface); }
.champion-art img { width: 100%; height: clamp(300px, 52vw, 400px); object-fit: contain; }
.champion-body { padding: 24px; display: grid; gap: 16px; }
.champion-body h2 { font-size: clamp(28px, 6vw, 40px); }
.panel { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 16px; display: grid; gap: 8px; }
.panel h3 { font-size: 12px; letter-spacing: .3em; color: var(--cyan); }
.panel.gold { border-color: color-mix(in oklab, var(--gold) 45%, transparent); }
.panel.gold h3 { color: var(--gold); }
.path { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
.path li { display: grid; grid-template-columns: 96px 1fr; gap: 8px; }
.path b { color: var(--fg); font-weight: 500; }
.path span:first-child { font-family: var(--font-display); text-transform: uppercase; font-size: 12px; letter-spacing: .1em; color: var(--gold); padding-top: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }

/* Character grid */
.filters { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; align-items: center; }
.search { position: relative; flex: 1 1 260px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.search input, select.field { width: 100%; height: 40px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); padding: 0 12px 0 36px; }
select.field { padding-left: 12px; }
.seg { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 6px; padding: 3px; }
.seg button { border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 4px; font-family: var(--font-display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.seg button[aria-pressed="true"] { background: color-mix(in oklab, var(--red) 16%, transparent); color: var(--red); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-top: 12px; }
.chip { flex-shrink: 0; border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 99px; padding: 4px 12px; font-size: 12px; }
.chip[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); background: color-mix(in oklab, var(--cyan) 10%, transparent); }
.count { font-size: 12px; color: var(--muted); margin-top: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 168px), 1fr)); gap: 16px; margin-top: 12px; padding: 0; list-style: none; }
.tile { border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s; }
.tile:hover { border-color: color-mix(in oklab, var(--red) 70%, transparent); }
.tile > button { border: 0; background: none; text-align: left; padding: 0; display: flex; flex-direction: column; flex: 1; }
.tile img { width: 100%; aspect-ratio: 4/5; object-fit: cover; object-position: top; background: var(--surface); }
.tile .meta { padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.tile .name { font-family: var(--font-display); text-transform: uppercase; line-height: 1.15; }
.tile footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding: 6px 12px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile footer button { border: 0; background: none; color: var(--cyan); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 0; }
.trophy { color: var(--gold); }

/* Versus */
.vs-pickers { display: grid; gap: 12px; margin-top: 32px; align-items: end; }
@media (min-width: 720px) { .vs-pickers { grid-template-columns: 1fr auto 1fr; } }
.vs-pickers label { display: grid; gap: 4px; font-family: var(--font-display); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.vs-pickers .mid { display: flex; justify-content: center; gap: 8px; }
.record { margin-top: 20px; text-align: center; }
.score { font-family: var(--font-display); font-size: 44px; font-variant-numeric: tabular-nums; }
.score .lead { color: var(--gold); }
.duel { display: grid; gap: 20px; margin-top: 20px; }
@media (min-width: 820px) { .duel { grid-template-columns: 1fr 1fr; } }
.card { border: 1px solid var(--line); background: var(--card); border-radius: 12px; overflow: hidden; min-width: 0; }
.card-art { background: var(--surface); }
.card-art img { width: 100%; height: 300px; object-fit: contain; }
.card-body { padding: 20px; display: grid; gap: 14px; }
.card-body h2 { font-size: 26px; }
.stats2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { border: 1px solid var(--line); background: color-mix(in oklab, var(--surface) 70%, transparent); border-radius: var(--radius); padding: 12px; text-align: center; min-width: 0; }
.stat .v { font-family: var(--font-display); font-size: 24px; text-transform: uppercase; line-height: 1.15; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 11px; color: var(--gold); }
.stat .l { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.dots { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
.dots li { display: flex; gap: 8px; }
.dots li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); flex-shrink: 0; margin-top: 8px; }
.dots.red li::before { background: var(--red); }
.sub-h { display: flex; align-items: center; gap: 8px; font-size: 14px; letter-spacing: .12em; }
.sub-h svg { width: 16px; height: 16px; }

/* Leaderboard */
.table-wrap { margin-top: 32px; border: 1px solid var(--line); border-radius: 12px; background: color-mix(in oklab, var(--surface) 70%, transparent); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-family: var(--font-display); font-weight: 500; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--line); }
td { padding: 8px 14px; border-bottom: 1px solid color-mix(in oklab, var(--line) 60%, transparent); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.num { text-align: right; }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.who img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; object-position: top; border: 1px solid var(--line); flex-shrink: 0; }
.who div { min-width: 0; }
.rank { font-family: var(--font-display); color: var(--muted); }
.m1 { color: var(--gold); } .m2 { color: var(--cyan); } .m3 { color: var(--red); }
.status { text-align: center; font-size: 13px; color: var(--muted); margin-top: 12px; }

/* History */
.stats4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 12px; margin-top: 32px; }
.rates { margin-top: 20px; }
.rate { display: grid; grid-template-columns: minmax(0, 13rem) 1fr 6.5rem; gap: 12px; align-items: center; font-size: 14px; }
.rate span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rate span:last-child { text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 520px) { .rate { grid-template-columns: minmax(0, 1fr) 4.5rem; } .rate .bar { grid-column: 1 / -1; grid-row: 2; } }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
.section-head h2 { font-size: 22px; }
.entries { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
.entry { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 8px 12px 8px 8px; }
.entry img { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; object-position: top; border: 1px solid color-mix(in oklab, var(--gold) 50%, transparent); flex-shrink: 0; }
.entry .txt { flex: 1; min-width: 0; }
.entry .txt p:first-child { font-family: var(--font-display); text-transform: uppercase; }
.entry .txt p:last-child { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { margin-top: 40px; border: 1px dashed var(--line); border-radius: 12px; padding: 40px 16px; text-align: center; color: var(--muted); display: grid; gap: 16px; justify-items: center; }
.loader { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.loader input { flex: 1 1 240px; height: 38px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); padding: 0 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; min-width: 0; }
.confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }

/* About */
.steps { list-style: none; padding: 0; margin: 32px 0 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.steps li { border: 1px solid var(--line); background: color-mix(in oklab, var(--surface) 70%, transparent); border-radius: 12px; padding: 16px; display: grid; gap: 6px; align-content: start; }
.steps .k { font-family: var(--font-display); font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--red); }
.steps h2 { font-size: 18px; }
.steps p { color: var(--muted); font-size: 14px; }
.faq { margin-top: 40px; max-width: 760px; margin-inline: auto; }
.faq h2 { font-size: 24px; margin-bottom: 8px; }
details { border-bottom: 1px solid var(--line); padding: 14px 0; }
summary { cursor: pointer; font-weight: 500; }
details p { color: var(--muted); font-size: 14px; margin-top: 8px; max-width: 65ch; }

/* Detail dialog */
dialog { width: min(680px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--fg); overflow: auto; }
dialog::backdrop { background: rgba(4, 7, 14, .78); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 1; }
.dlg-head h2 { font-size: 26px; }
.dlg-body { padding: 20px; display: grid; gap: 16px; }
.dlg-art { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.dlg-art img { width: 100%; height: 300px; object-fit: contain; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pill.c { border-color: color-mix(in oklab, var(--cyan) 50%, transparent); color: var(--cyan); }
.two { display: grid; gap: 12px; }
@media (min-width: 600px) { .two { grid-template-columns: 1fr 1fr; } }

/* Toast + confetti */
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; background: var(--raised); border: 1px solid var(--line); color: var(--fg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 60; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.confetti i { position: absolute; top: -10px; width: 9px; height: 4px; border-radius: 1px; animation: fall linear forwards; }
@keyframes fall { 0% { transform: translateY(-5vh) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(110vh) rotate(var(--r)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .confetti { display: none; } }

body { margin: 0; }
[hidden] { display: none !important; }

/* Theme song player: one persistent Spotify controller, docked to the bottom */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: color-mix(in oklab, var(--surface) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); transition: transform .3s; }
.player.off { transform: translateY(130%); pointer-events: none; }
.player-in { display: flex; align-items: center; gap: 12px; max-width: 760px; padding-top: 8px; }
.player-main { flex: 1; min-width: 0; }
.player-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--cyan); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: 4px; }
.player iframe { display: block; border-radius: 10px; }
.player.needs-tap .player-label { color: var(--gold); font-weight: 600; white-space: normal; }
.player.needs-tap iframe { border-radius: 12px; box-shadow: 0 0 0 2px var(--gold); animation: tap-pulse 1.4s ease-in-out infinite; }
@keyframes tap-pulse { 0%, 100% { box-shadow: 0 0 0 2px color-mix(in oklab, var(--gold) 90%, transparent); } 50% { box-shadow: 0 0 0 6px color-mix(in oklab, var(--gold) 25%, transparent); } }
body.playing { padding-bottom: 130px; }
.fighter .music { position: absolute; bottom: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid color-mix(in oklab, var(--cyan) 60%, transparent); background: color-mix(in oklab, var(--surface) 80%, transparent); color: var(--cyan); display: grid; place-items: center; }
.fighter .music svg { width: 16px; height: 16px; }
.fighter .music[aria-pressed="true"] { background: color-mix(in oklab, var(--cyan) 18%, transparent); border-color: var(--cyan); }

footer.site { border-top: 1px solid var(--line); }
footer.site p { padding-block: 24px; text-align: center; font-size: 12px; color: var(--muted); }
</style>

/* ---------- tournament logic ---------- */
function shuffle(items) {
  const out = items.slice();
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}
function emptyRounds() {
  return Array.from({ length: 6 }, (_, r) => Array.from({ length: 32 >> r }, () => ({ a: null, b: null, w: null })));
}
function createBracket() {
  const seeds = shuffle(CHARS);
  const rounds = emptyRounds();
  rounds[0].forEach((m, i) => { m.a = seeds[i * 2]; m.b = seeds[i * 2 + 1]; });
  return rounds;
}
const clone = (rounds) => rounds.map((round) => round.map((m) => ({ ...m })));
const winnerOf = (m) => (!m.w ? null : m.a?.id === m.w ? m.a : m.b?.id === m.w ? m.b : null);
function propagate(rounds) {
  const next = clone(rounds);
  for (let r = 0; r < next.length - 1; r++) {
    next[r + 1].forEach((m, i) => {
      m.a = winnerOf(next[r][i * 2]);
      m.b = winnerOf(next[r][i * 2 + 1]);
      if (m.w && m.a?.id !== m.w && m.b?.id !== m.w) m.w = null;
    });
  }
  return next;
}
const isComplete = (round) => round.every((m) => m.w);
const isReady = (round) => round.every((m) => m.a && m.b);
function currentRound(rounds) { for (let r = 0; r < rounds.length; r++) if (!isComplete(rounds[r])) return r; return rounds.length - 1; }
const championOf = (rounds) => winnerOf(rounds[5][0]);
function runnerUpOf(rounds) { const f = rounds[5][0]; const c = winnerOf(f); return c ? (f.a.id === c.id ? f.b : f.a) : null; }
const picksMade = (rounds) => rounds.flat().filter((m) => m.w).length;
function results(rounds) {
  return rounds.flatMap((round, r) => round.flatMap((m) => {
    const w = winnerOf(m); const l = w && (m.a.id === w.id ? m.b : m.a);
    return w && l ? [{ round: r, winner: w, loser: l }] : [];
  }));
}
function victoryPath(rounds, id) {
  return rounds.flatMap((round, r) => {
    const m = round.find((x) => x.w === id);
    return m ? [{ round: r, opponent: m.a.id === id ? m.b : m.a }] : [];
  });
}
function coinFlip(rounds, r) { rounds[r].forEach((m) => { if (!m.w && m.a && m.b) m.w = (Math.random() < 0.5 ? m.a : m.b).id; }); }

/* Bracket code: version, roster size, 64 seed indexes, then 2 bits per match (0 open, 1 top, 2 bottom). Hex so it fits in a plain #name. */
function encode(rounds) {
  const bytes = new Uint8Array(2 + 64 + 16);
  bytes[0] = 1; bytes[1] = CHARS.length;
  rounds[0].forEach((m, i) => { bytes[2 + i * 2] = INDEX_BY_ID.get(m.a.id); bytes[3 + i * 2] = INDEX_BY_ID.get(m.b.id); });
  let bit = 0;
  rounds.forEach((round) => round.forEach((m) => {
    const p = !m.w ? 0 : m.w === m.a?.id ? 1 : 2;
    bytes[66 + (bit >> 3)] |= p << (bit & 7);
    bit += 2;
  }));
  return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
}
function decode(code) {
  if (typeof code !== "string" || !/^[0-9a-f]{164}$/i.test(code.trim())) return null;
  const bytes = Uint8Array.from(code.trim().match(/../g), (h) => parseInt(h, 16));
  if (bytes[0] !== 1 || bytes[1] !== CHARS.length) return null;
  const seeds = Array.from(bytes.slice(2, 66));
  if (new Set(seeds).size !== 64 || seeds.some((i) => i >= CHARS.length)) return null;
  let rounds = emptyRounds();
  rounds[0].forEach((m, i) => { m.a = CHARS[seeds[i * 2]]; m.b = CHARS[seeds[i * 2 + 1]]; });
  let bit = 0;
  for (let r = 0; r < 6; r++) {
    rounds[r].forEach((m) => {
      const p = (bytes[66 + (bit >> 3)] >> (bit & 7)) & 3;
      if (p === 1 && m.a) m.w = m.a.id;
      if (p === 2 && m.b) m.w = m.b.id;
      bit += 2;
    });
    rounds = propagate(rounds);
  }
  return rounds;
}

/* ---------- factions ---------- */
const factionsOf = (c) => c.t.split("/").map((s) => s.trim());
const FACTIONS = (() => {
  const counts = new Map();
  CHARS.forEach((c) => factionsOf(c).forEach((f) => counts.set(f, (counts.get(f) || 0) + 1)));
  return [...counts].filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([f]) => f);
})();

/* ---------- theme songs (Spotify iFrame API) ---------- */
/* One controller lives for the whole visit. Phones only allow playback to start inside a tap,
   so playTheme must be called straight from a click handler. */
/* Phones can still refuse to start sound from inside Spotify's frame, so playback is
   confirmed through Spotify's own progress events. If a song hasn't started, the bar asks
   for one tap on Spotify's play button, which phones always allow. */
/* iPhones let a player start songs on its own once it has been tapped during the visit, so
   phones get a one-time setup: tap ▶ once, and later champions' themes can start by themselves. */
const IS_TOUCH = window.matchMedia?.("(pointer: coarse)").matches ?? false;
const player = { ctrl: null, now: null, playing: false, checks: [], unlocked: !IS_TOUCH, setup: false };
function initPlayer() {
  window.onSpotifyIframeApiReady = (api) => {
    const first = CHARS.find((c) => c.sp);
    api.createController(document.getElementById("spotify-host"), { uri: `spotify:track:${first.sp}`, width: "100%", height: 80 }, (ctrl) => {
      player.ctrl = ctrl;
      ctrl.addListener("playback_update", (e) => {
        player.playing = Boolean(e?.data && !e.data.isPaused && !e.data.isBuffering);
        if (!player.playing) return;
        setNeedsTap(false);
        if (!player.unlocked) {
          player.unlocked = true;
          if (state.view === "bracket") render();
        }
        if (player.setup) {
          player.setup = false;
          setTimeout(() => {
            if (player.now && !championOf(state.rounds)) stopTheme();
            toast("Theme songs are on. Your champion's theme will play when you crown them.");
          }, 1500);
        }
      });
      if (player.now) playTheme(player.now);
    });
  };
  const script = document.createElement("script");
  script.src = "https://open.spotify.com/embed/iframe-api/v1";
  script.async = true;
  document.body.appendChild(script);
}
function playTheme(c) {
  if (!c?.sp) return;
  const same = player.now?.id === c.id;
  player.now = c;
  document.getElementById("player-label").textContent = `${c.n} — ${c.tt || "Theme song"}`;
  document.getElementById("player").classList.remove("off");
  document.body.classList.add("playing");
  setNeedsTap(false);
  syncMusicButtons();
  player.checks.forEach(clearTimeout);
  player.checks = [];
  if (!player.ctrl) return; // starts once the controller is ready
  player.playing = false;
  try {
    if (same) player.ctrl.resume(); else { player.ctrl.loadUri(`spotify:track:${c.sp}`); player.ctrl.play(); }
  } catch {}
  // loadUri can swallow an immediate play(); nudge once, then ask for a tap.
  player.checks.push(setTimeout(() => { if (player.now === c && !player.playing) try { player.ctrl.play(); } catch {} }, 1200));
  player.checks.push(setTimeout(() => { if (player.now === c && !player.playing) setNeedsTap(true); }, 3000));
}
function startSetup() {
  const r = currentRound(state.rounds);
  const c = state.rounds[r].flatMap((m) => [m.a, m.b]).find((x) => x?.sp) || CHARS.find((x) => x.sp);
  player.checks.forEach(clearTimeout);
  player.checks = [];
  player.setup = true;
  player.now = c;
  document.getElementById("player").classList.remove("off");
  document.body.classList.add("playing");
  try { player.ctrl?.loadUri(`spotify:track:${c.sp}`); } catch {}
  document.getElementById("player").classList.add("needs-tap");
  document.getElementById("player-label").textContent = "Tap ▶ once to turn on theme songs";
  syncMusicButtons();
}
function setNeedsTap(on) {
  const bar = document.getElementById("player");
  bar.classList.toggle("needs-tap", on);
  const c = player.now;
  if (c) document.getElementById("player-label").textContent = on ? `Tap ▶ to play ${c.n}'s theme` : `${c.n} — ${c.tt || "Theme song"}`;
}
function stopTheme() {
  player.checks.forEach(clearTimeout);
  player.checks = [];
  setNeedsTap(false);
  player.setup = false;
  player.now = null;
  document.getElementById("player").classList.add("off");

function syncMusicButtons() {

}

/* ---------- actions ---------- */
function commit(next) {
  const before = championOf(state.rounds);
  state.rounds = next;
  save();
  const champ = championOf(next);
  if (champ && champ.id !== before?.id) crowned(next, champ);
  render();
}
function crowned(rounds, champ) {
  state.review = false;
  playTheme(champ);
  const code = encode(rounds);
  if (state.history.some((h) => h.code === code)) return;
  state.history = [{ code, championId: champ.id, runnerUpId: runnerUpOf(rounds)?.id || null, at: new Date().toISOString() }, ...state.history].slice(0, 100);
  store.set("mcu64:history", state.history);
  confetti();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
const actions = {
  pick(el) {
    const r = +el.dataset.r, m = +el.dataset.m, id = el.dataset.id;
    const draft = clone(state.rounds);
    draft[r][m].w = draft[r][m].w === id ? null : id;
    const prevRound = currentRound(state.rounds);
    state.viewRound = null;
    commit(propagate(draft));
    if (state.mode === "matchups" && currentRound(state.rounds) !== prevRound && !championOf(state.rounds)) window.scrollTo({ top: 0, behavior: "smooth" });
  },
  simRound() {
    const r = currentRound(state.rounds);
    if (!isReady(state.rounds[r])) return;
    const draft = clone(state.rounds); coinFlip(draft, r);
    state.viewRound = null;
    commit(propagate(draft));
  },
  simAll() {
    let draft = clone(state.rounds);
    for (let r = 0; r < 6; r++) { coinFlip(draft, r); draft = propagate(draft); }
    state.viewRound = null;
    commit(draft);
  },
  reshuffle() { state.rounds = createBracket(); state.viewRound = null; state.review = false; state.fromShare = false; save(); render(); },
  clearPicks() {
    const draft = clone(state.rounds); draft.forEach((round) => round.forEach((m) => (m.w = null)));
    state.viewRound = null; state.review = false; commit(propagate(draft));
  },
  toggleMode() { state.mode = state.mode === "matchups" ? "bracket" : "matchups"; render(); },
  round(el) { state.viewRound = +el.dataset.r; render(); },
  review() { state.review = true; state.mode = "bracket"; render(); },
  backToChamp() { state.review = false; render(); },
  async share() {
    const code = encode(state.rounds);
    await copy(`${location.origin}${location.pathname}#b-${code}`, "Bracket link copied. Anyone who opens it sees your exact picks.");
  },
  async copySummary() {
    const c = championOf(state.rounds);
    const lines = ["MCU 64 — Tournament Summary", `Champion: ${c.n}`, `Team: ${c.t}`, "", "Path to victory:",
      ...victoryPath(state.rounds, c.id).map((s) => `  ${ROUND_NAMES[s.round]}: defeated ${s.opponent.n}`), "", `Best MCU moment: ${c.m}`, "", `Bracket code: ${encode(state.rounds)}`];
    await copy(lines.join("\n"), "Summary copied to your clipboard");
  },
  info(el) { openDetail(BY_ID.get(el.dataset.id)); },
  setupThemes() { startSetup(); },
  dismissSetup() { state.setupDismissed = true; render(); },
  theme(el) { const c = BY_ID.get(el.dataset.id); player.now?.id === c.id ? stopTheme() : playTheme(c); },
  stopTheme() { stopTheme(); },
  closeDetail() { document.getElementById("detail").close(); },
  faction(el) { state.faction = el.dataset.f || null; render(); },
  sort(el) { state.sort = el.dataset.s; render(); },
  compare(el) { state.vsA = el.dataset.id; if (state.vsB === state.vsA) state.vsB = state.vsA === "thanos" ? "iron-man" : "thanos"; go("versus"); },
  swap() { [state.vsA, state.vsB] = [state.vsB, state.vsA]; render(); },
  randomPair() { const [a, b] = shuffle(CHARS); state.vsA = a.id; state.vsB = b.id; render(); },
  open(el) { loadBracket(el.dataset.code, false); go("bracket"); },
  async copyCode(el) { await copy(el.dataset.code, "Bracket code copied"); },
  loadCode() {
    const input = document.getElementById("code-input");
    const raw = (input?.value || "").trim().replace(/^.*#b-/, "");
    if (!decode(raw)) { toast("That code isn't a valid MCU 64 bracket. Check that you copied all 164 characters."); return; }
    loadBracket(raw, true); go("bracket");
  },
  askClear() { state.confirmClear = true; render(); },
  cancelClear() { state.confirmClear = false; render(); },
  doClear() { state.history = []; state.confirmClear = false; store.del("mcu64:history"); render(); toast("History cleared"); },
};
function loadBracket(code, fromShare) {
  const rounds = decode(code); if (!rounds) return false;
  state.rounds = rounds; state.fromShare = fromShare; state.viewRound = null; state.review = false; save();
  return true;
}
async function copy(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch { toast("Your browser blocked copying. Use Copy code on the My History page instead."); }
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}
function confetti() {
  const box = document.createElement("div"); box.className = "confetti"; box.setAttribute("aria-hidden", "true");
  const colors = ["var(--red)", "var(--gold)", "var(--cyan)", "var(--fg)"];
  for (let i = 0; i < 90; i++) {
    const p = document.createElement("i");
    p.style.left = `${Math.random() * 100}%`; p.style.background = colors[i % 4];
    p.style.animationDuration = `${2.6 + Math.random() * 2}s`; p.style.animationDelay = `${Math.random() * 1.2}s`;
    p.style.setProperty("--r", `${Math.random() * 720 - 360}deg`);
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 6000);
}
function spotify(c, cls = "btn btn-line btn-sm") {
  return c.sp ? `<button class="${cls}" data-act="theme" data-id="${c.id}" aria-pressed="${player.now?.id === c.id}">${ICON.music} Play ${esc(c.tt || "theme song")}</button>` : "";

function viewHistory() {
  const h = state.history;
  const loader = `<div class="panel" style="margin-top:24px"><h3>Open a bracket code</h3><p class="actor" style="white-space:normal">Paste a bracket link or code someone shared with you to load their exact picks.</p>
    <div class="loader"><input id="code-input" aria-label="Bracket code" placeholder="Bracket link or code"><button class="btn btn-primary" data-act="loadCode">Open bracket</button></div></div>`;
  const head = `<section class="page-head"><p class="eyebrow">This browser</p><h1>My History</h1><p class="lede">Every tournament you finish is saved in this browser so you can revisit or share it.</p></section>`;
  if (!h.length) return head + `<div class="empty"><p>No finished tournaments yet.</p><a class="btn btn-primary" href="#bracket">Start picking</a></div>` + loader;

  const titles = myTitles();
  const wins = new Map(), apps = new Map();
  h.forEach((e) => results(decode(e.code)).forEach(({ winner, loser }) => {
    wins.set(winner.id, (wins.get(winner.id) || 0) + 1);
    apps.set(winner.id, (apps.get(winner.id) || 0) + 1); apps.set(loser.id, (apps.get(loser.id) || 0) + 1);
  }));
  const top = (m) => [...m].sort((x, y) => y[1] - x[1])[0];
  const fav = top(titles), most = top(wins);
  const rates = [...apps].filter(([, n]) => n >= 3).map(([id, n]) => ({ id, n, r: (wins.get(id) || 0) / n })).sort((x, y) => y.r - x.r || y.n - x.n).slice(0, 5);
  return head + `
    <section class="stats4">
      <div class="stat"><p class="v">${h.length}</p><p class="l">Tournaments</p></div>
      <div class="stat"><p class="v">${titles.size}</p><p class="l">Different champions</p></div>
      <div class="stat"><p class="v">${esc(BY_ID.get(fav[0]).n)}</p><p class="s">${plural(fav[1], "title", "titles")}</p><p class="l">Favorite champion</p></div>
      <div class="stat"><p class="v">${esc(BY_ID.get(most[0]).n)}</p><p class="s">${plural(most[1], "win", "wins")}</p><p class="l">Most match wins</p></div>
    </section>
    ${rates.length ? `<section class="panel rates"><h3>Best match win rate (3+ matches)</h3><div style="display:grid;gap:10px">${rates.map((x) =>
      `<div class="rate"><span>${esc(BY_ID.get(x.id).n)}</span><div class="bar gold"><i style="width:${x.r * 100}%"></i></div><span>${Math.round(x.r * 100)}% of ${x.n}</span></div>`).join("")}</div>
      <p class="actor" style="white-space:normal">${CHARS.length - titles.size} of ${CHARS.length} characters have never won one of your tournaments.</p></section>` : ""}
    <div class="section-head"><h2>Past champions</h2>
      ${state.confirmClear ? `<div class="confirm">Remove all ${h.length} saved brackets? <button class="btn btn-primary btn-sm" data-act="doClear">Clear history</button><button class="btn btn-line btn-sm" data-act="cancelClear">Cancel</button></div>`
        : `<button class="btn btn-line btn-sm" data-act="askClear">Clear history</button>`}</div>
    <ul class="entries">${h.map((e) => {
      const c = BY_ID.get(e.championId), ru = BY_ID.get(e.runnerUpId);
      return `<li class="entry"><img src="${img(c)}" alt=""><div class="txt"><p>${esc(c.n)}</p><p>${ru ? `def. ${esc(ru.n)} · ` : ""}${new Date(e.at).toLocaleString()}</p></div>
        <button class="btn btn-line btn-sm" data-act="copyCode" data-code="${e.code}">Copy code</button>
        <button class="btn btn-ghost btn-sm" data-act="open" data-code="${e.code}">Open</button></li>`;
    }).join("")}</ul>` + loader;
}

function viewAbout() {
  const steps = [
    ["The draw", `All ${CHARS.length} characters are shuffled into 32 random first-round matchups. Tap “New tournament” any time for a fresh draw.`],
    ["Pick your winners", "Tap a character to send them through and tap again to undo. Changing an early pick clears anything later that depended on it."],
    ["Six rounds", `${ROUND_NAMES.join(" → ")}. 63 picks crown one champion.`],
    ["Crown and share", "Your champion's theme song plays, and they go onto your leaderboard and into My History. Share a link so friends can see your exact picks."],
  ];
  const faq = [
    ["Is my bracket saved?", "Yes. Picks save in this browser as you make them, so you can close the tab and come back. Finished tournaments appear under My History."],
    ["How does sharing work?", "“Share bracket” copies a link that holds your whole draw and every pick. Anyone who opens it sees your bracket. Opening a shared bracket replaces the one you're working on."],
    ["How are simulations decided?", "Each undecided matchup is a fair coin flip. Picks you've already made are never changed."],
    ["How is the leaderboard counted?", "The leaderboard ranks the champions of every tournament finished in this browser. Opening a bracket you've already finished doesn't count it again."],
    ["Where are the theme songs?", "Tap the music note on any character. The song plays in the Spotify bar at the bottom and keeps going while you pick."],
    ["Is this official?", "No. MCU 64 is a fan-made game and isn't affiliated with or endorsed by Marvel Studios or Disney."],
  ];
  return `<section class="page-head"><p class="eyebrow">How it works</p><h1>About MCU 64</h1></section>
    <ol class="steps">${steps.map(([t, b], i) => `<li><p class="k">Step ${i + 1}</p><h2>${t}</h2><p>${esc(b)}</p></li>`).join("")}</ol>
    <section class="faq"><h2>FAQ</h2>${faq.map(([q, a]) => `<details><summary>${q}</summary><p>${esc(a)}</p></details>`).join("")}</section>
    <div class="toolbar"><a class="btn btn-primary" href="#bracket">Start your bracket</a></div>`;
}

function openDetail(c) {
  const dlg = document.getElementById("detail");
  dlg.innerHTML = `<div class="dlg-head"><h2 id="detail-title">${esc(c.n)}</h2><button class="btn btn-line btn-icon" data-act="closeDetail" aria-label="Close">${ICON.x}</button></div>
    <div class="dlg-body">
      <div class="dlg-art"><img src="${img(c)}" alt="${esc(c.n)}"></div>
      <div class="pills"><span class="pill c">${esc(c.t)}</span><span class="pill">Played by ${esc(c.a)}</span></div>
      <p class="lede" style="max-width:none">${esc(c.b)}</p>
      ${c.sp ? `<div class="panel"><h3>Theme song</h3><div class="row">${spotify(c)}</div></div>` : ""}
      <div class="panel gold"><h3>Best MCU moment</h3><p>${esc(c.m)}</p></div>
      <div class="two">
        <div class="panel"><h3 class="sub-h">${ICON.swords} Strengths</h3><ul class="dots">${c.s.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></div>
        <div class="panel"><h3 class="sub-h" style="color:var(--red)">${ICON.alert} Weaknesses</h3><ul class="dots red">${c.w.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></div>
      </div>
      <div class="row"><button class="btn btn-line" data-act="compare" data-id="${c.id}">${ICON.swords} Compare in Versus</button></div>
    </div>`;
  if (!dlg.open) dlg.showModal();
}

/* ---------- render + routing ---------- */
const VIEWS = { bracket: viewBracket, characters: viewCharacters, versus: viewVersus, leaderboard: viewLeaderboard, history: viewHistory, about: viewAbout };
function render() {
  const app = document.getElementById("app");
  const focusId = document.activeElement?.id;
  const caret = document.activeElement?.selectionStart;
  app.innerHTML = VIEWS[state.view]();
  document.querySelectorAll("[data-nav]").forEach((a) => (a.dataset.nav === state.view ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  syncMusicButtons();
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); if (caret != null && el.setSelectionRange) try { el.setSelectionRange(caret, caret); } catch {} } }
}
function go(view) {
  document.getElementById("detail").open && document.getElementById("detail").close();
  if (location.hash !== `#${view}`) location.hash = view; else route();
}
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith("b-")) {
    const code = h.slice(2).toLowerCase();
    // Only load a shared code once per browser, so a refresh after more picks keeps them.
    if (store.get("mcu64:lastShare", "") !== code && decode(code)) { store.set("mcu64:lastShare", code); loadBracket(code, true); }
    state.view = "bracket";
  } else {
    state.view = VIEWS[h] ? h : "bracket";
  }
  render();
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el && actions[el.dataset.act]) { e.preventDefault(); actions[el.dataset.act](el); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "char-search") { state.q = e.target.value; render(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "vs-a") { state.vsA = e.target.value; render(); }
  if (e.target.id === "vs-b") { state.vsB = e.target.value; render(); }
});
document.getElementById("detail").addEventListener("click", (e) => { if (e.target.id === "detail") e.target.close(); });
window.addEventListener("hashchange", () => { route(); window.scrollTo({ top: 0 }); });

route();
initPlayer();
</script>
</body>
</html>
